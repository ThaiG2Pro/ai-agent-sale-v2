[project]
name = "ai-agent-sale-v2"
version = "0.1.0"
description = "SME-Ready AI Sales Agent (2026) - High-performance, asynchronous, and offline-capable RAG agent."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["ai", "agent", "rag", "sales", "sme", "fastapi", "async"]
authors = [
    { name = "Thai", email = "thai@example.com" }
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph>=0.3",
    "litellm",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg",
    "pgvector",
    "pymupdf",
    "crawl4ai",
    "httpx",
    "logfire[fastapi]",
    "numpy",
    "python-dotenv",
    "pydantic-settings",
    "alembic",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-exporter-otlp>=1.39.1",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.60b1",
    "opentelemetry-instrumentation-logging>=0.60b1",
    "opentelemetry-instrumentation-httpx>=0.60b1",
    "arize-phoenix-otel>=0.15.0",
    "openinference-instrumentation-langchain>=0.1.61",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "uuid-utils",
    "openinference-instrumentation-langchain>=0.1.61",
    "arize-phoenix-otel>=0.15.0",
    "langgraph-checkpoint-postgres>=3.0.4",
    "psycopg[binary]>=3.1.9",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff",
]

[tool.ruff]
line-length = 99
target-version = "py313"

exclude = [
    ".git",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "node_modules",
    ".ipynb_checkpoints",
]

respect-gitignore = true

[tool.ruff.lint]
select = [
    "E", "F", "W",   # core
    "I",             # import sorting
    "UP",            # syntax upgrade
    "ASYNC",         # async safety
    "FAST",          # fastapi
    "B",             # bugbear
    "RUF",           # ruff rules
    "TCH",           # type checking
]
ignore = ["B008"]  # False positive for typer.Option defaults (standard pattern)
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["api", "core", "models", "services"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = []
quote-annotations = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# DB_NAME is force-overridden to "ai_agent_test" by tests/conftest.py at
# module-load time, before any application code is imported.  This means
# every Settings() instantiation during a test run uses the isolated test
# database and your development data is never touched.

[tool.logfire]
ignore_no_config = true

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "F401"]
"__init__.py" = ["F401"]
"scripts/seed_bulk.py" = ["E501"]  # Long strings in CLI help text and docstrings are intentional
