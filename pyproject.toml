[project]
name = "ai-agent-sale-v2"
version = "0.1.0"
description = "SME-Ready AI Sales Agent (2026)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "litellm",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg",
    "pgvector",
    "pymupdf",
    "crawl4ai",
    "httpx",
    "logfire",
    "numpy",
    "python-dotenv",
    "pydantic-settings",
    "alembic",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py313"

exclude = [
    ".git",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "node_modules",
    ".ipynb_checkpoints",
]

respect-gitignore = true

[tool.ruff.lint]
select = [
    "E", "F", "W",   # core
    "I",             # import sorting
    "UP",            # syntax upgrade
    "ASYNC",         # async safety
    "FAST",          # fastapi
    "B",             # bugbear
    "RUF",           # ruff rules
    "TCH",           # type checking
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["app", "core", "models"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = []
quote-annotations = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.logfire]
ignore_no_config = true

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "F401"]
"__init__.py" = ["F401"]

