[project]
name = "ai-agent-sale-v2"
version = "0.1.0"
description = "SME-Ready AI Sales Agent (2026)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "litellm",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg",
    "pgvector",
    "pymupdf",
    "crawl4ai",
    "httpx",
    "logfire",
    "numpy",
    "python-dotenv",
    "pydantic-settings",
    "alembic",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "ASYNC"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.logfire]
ignore_no_config = true
