services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-ai_agent}
      DB_PORT: ${DB_PORT:-5432}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-1234567890:telegram_bot_token_for_local_testing_12345}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-local_webhook_secret_1234567890}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-https://example.local/webhooks/telegram}
      DB_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-0}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/readiness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    secrets:
      - db_password
    networks:
      - ai_agent_net

  db:
    image: pgvector/pgvector:pg17
    container_name: ai-agent-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_NAME:-ai_agent}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U ${DB_USER:-user}
          -d ${DB_NAME:-ai_agent}
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    secrets:
      - db_password
    networks:
      - ai_agent_net
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=80
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=4MB

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: ai-agent-phoenix
    ports:
      - "6006:6006" # Phoenix UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    restart: unless-stopped
    networks:
      - ai_agent_net

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  postgres_data:

networks:
  ai_agent_net:
    driver: bridge
