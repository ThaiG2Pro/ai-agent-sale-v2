services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent-api
    network_mode: host
    environment:
      DB_HOST: localhost
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-ai_agent}
      DB_PORT: ${DB_PORT:-5432}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-1234567890:telegram_bot_token_for_local_testing_12345}
      # No baked default — a guessable webhook secret lets anyone forge updates.
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET must be set in the environment or .env (min 20 chars)}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-https://example.local/webhooks/telegram}
      DB_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-0}
      # ── AI provider config ──────────────────────────────────────────────
      # Default: Ollama running on the Docker host (see extra_hosts below).
      # Cloud fast-path: set CHAT_MODEL etc. to any LiteLLM model string
      # (e.g. gemini/gemini-2.5-flash) + the matching provider API key.
      # Empty pass-through values are ignored by the app (env_ignore_empty).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:8080}
      LLAMA_SERVER_BASE_URL: ${LLAMA_SERVER_BASE_URL:-http://localhost:8080/v1}
      OLLAMA_EMBED_BASE_URL: ${OLLAMA_EMBED_BASE_URL:-http://localhost:11434}
      LIGHT_CHAT_MODEL: ${LIGHT_CHAT_MODEL:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      POWERFUL_CHAT_MODEL: ${POWERFUL_CHAT_MODEL:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      PREMIUM_MODEL: ${PREMIUM_MODEL:-}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      X_ADMIN_KEY: ${X_ADMIN_KEY:-}
      # ── Observability ───────────────────────────────────────────────────
      # Inside the compose network the OTLP collector is the phoenix service,
      # NOT localhost (the app default) — without this override no trace ever
      # leaves the api container.
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://localhost:4317}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-ai-sales-agent}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-ai-sales-agent}
    depends_on:
      db:
        condition: service_healthy
      phoenix:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/readiness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - .:/app
    restart: unless-stopped
    secrets:
      - db_password

  db:
    image: pgvector/pgvector:pg17
    container_name: ai-agent-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_NAME:-ai_agent}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U ${DB_USER:-user}
          -d ${DB_NAME:-ai_agent}
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    secrets:
      - db_password
    networks:
      - ai_agent_net
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=80
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=4MB

  phoenix:
    # Pinned minor version — `latest` broke reproducibility across machines.
    image: arizephoenix/phoenix:19.15
    container_name: ai-agent-phoenix
    ports:
      - "6006:6006" # Phoenix UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      # Persist trace storage (SQLite) in a named volume — without this every
      # container restart wipes all collected traces.
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - ai_agent_net

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  postgres_data:
  phoenix_data:

networks:
  ai_agent_net:
    driver: bridge
